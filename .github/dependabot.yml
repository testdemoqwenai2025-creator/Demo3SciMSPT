# Dependabot Configuration - Demo3SciMSPT Public Demo Repository
# Simplified automation for public showcase

version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - testdemoqwenai2025-creator
    labels:
      - dependencies
      - demo
    commit-message:
      prefix: "chore(deps)"
    # Focus on security patches only for public demo
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor"]
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - testdemoqwenai2025-creator
    labels:
      - ci
      - automated
