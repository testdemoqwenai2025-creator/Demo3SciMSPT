# Phase 3 CI/CD Pipeline - Main Workflow
name: Phase 3 CI/CD Pipeline

on:
  push:
    branches: [main, develop/**, feature/**]
  pull_request:
    branches: [main, develop/**]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Job 1: Code Quality
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Check TypeScript types
        run: npx tsc --noEmit --if-present

      - name: Format check with Prettier
        run: npx prettier --check . --if-present

  # Job 2: Unit Tests
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit --if-present
        env:
          CI: true

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Job 3: Build Verification
  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Verify build output
        run: |
          if [ -d "dist" ] || [ -d "build" ] || [ -d "out" ]; then
            echo "✅ Build successful"
            ls -la dist build out 2>/dev/null || true
          else
            echo "⚠️ No build output directory found (may be docs-only repo)"
          fi

  # Job 4: Security Scanning
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "⚠️ Vulnerabilities found (review required)"

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./ 
          base: main
          head: HEAD

  # Job 5: Documentation Check (for repos with docs)
  documentation-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation completeness
        run: |
          echo "Checking documentation..."
          
          # Check for README
          if [ ! -f "README.md" ]; then
            echo "❌ Missing README.md"
            exit 1
          fi
          echo "✅ README.md exists"
          
          # Check docs directory structure
          if [ -d "docs" ]; then
            echo "✅ docs/ directory found"
            find docs -type f -name "*.md" | head -20 || echo "   No markdown files in docs/"
          fi

  # Job 6: Deployment Gate (only on main branch merge)
  deployment-gate:
    name: 🚀 Deployment Gate
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build-verification, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🎉 Ready for deployment!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

      - name: Create deployment summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Deployment Ready
          
          **Repository**: ${{ github.repository }}
          **Commit**: \`${{ github.sha }}\`
          **Triggered by**: @${{ github.actor }}
          
          ### Checks Passed
          - [x] Code Quality
          - [x] Unit Tests  
          - [x] Build Verification
          - [x] Security Scan
          
          ---
          *Pipeline completed at $(date)*
          EOF
