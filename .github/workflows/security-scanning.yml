# Security Scanning Workflow
name: 🔒 Security Scanning

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'

jobs:
  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  code-vulnerability-scan:
    name: 🔍 Code Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 30

  secret-detection:
    name: 🔐 Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: HEAD~10
          head: HEAD

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  sast-analysis:
    name: 🛡️ SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SAST with CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, code-vulnerability-scan, secret-detection, sast-analysis]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🔒 Security Scan Report
          
          **Date**: $(date +%Y-%m-%d)
          **Repository**: ${{ github.repository }}
          
          ### Scan Results
          
          | Check | Status |
          |-------|--------|
          | Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || '⚠️ Review Required' }} |
          | Code Vulnerabilities | ${{ needs.code-vulnerability-scan.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |
          | Secret Detection | ${{ needs.secret-detection.result == 'success' && '✅ Clean' || '🔴 Secrets Detected' }} |
          | SAST Analysis | ${{ needs.sast-analysis.result == 'success' && '✅ Passed' || '⚠️ Issues Found' }} |
          
          ---
          *Automated security scan completed*
          EOF

      - name: Create issue on failure
        if: needs.code-vulnerability-scan.result == 'failure' || needs.secret-detection.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Alert - ${new Date().toISOString().split('T')[0]}`,
              body: `## Security Scan Detected Issues\n\n**Commit**: ${context.sha}\n\nPlease review the security scan results and address any vulnerabilities.\n\n[View Security Tab](https://github.com/${context.repo.owner}/${context.repo.repo}/security)`
            });
